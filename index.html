
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalkulator Aritmatika - Adly</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f8f9fa;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
}

.calculator-card {
    width: 100%;
    max-width: 800px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.header {
    background: #0d6efd;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.header h1 {
    font-size: 38px;
    margin-bottom: 12px;
    font-weight: 400;
}

.profile-photo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    margin-bottom: 12px;
    background: white;
}

.identity {
    display: inline-block;
    background: white;
    color: #4682a9;
    font-size: 20px;
    padding: 3px 8px;
}

.calculator-body {
    padding: 35px 40px;
}

.form-label {
    font-size: 22px;
    margin-bottom: 12px;
}

.form-control,
.form-select {
    height: 60px;
    font-size: 21px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.form-select {
    cursor: pointer;
}

.form-select optgroup {
    font-weight: bold;
    color: #0d6efd;
}

.form-select option {
    color: #212529;
    background: white;
}

.btn-hitung {
    width: 100%;
    height: 60px;
    font-size: 23px;
    background: #0d6efd;
    border: none;
    border-radius: 9px;
    color: white;
    margin-top: 0;
    cursor: pointer;
}

.btn-hitung:hover {
    background: #0b5ed7;
}

.result-box {
    margin-top: 38px;
    background: #212529;
    color: white;
    border-radius: 10px;
    min-height: 190px;
    text-align: center;
    padding: 30px 15px;
}

.result-box h4 {
    font-size: 20px;
    font-weight: 400;
}

#hasil {
    font-size: 75px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

#pesan {
    font-size: 15px;
    color: #ffc107;
    margin-top: 8px;
}

@media(max-width: 576px) {
    .calculator-body {
        padding: 25px 20px;
    }

    .header h1 {
        font-size: 29px;
    }

    .identity {
        font-size: 15px;
    }

    .form-label {
        font-size: 18px;
    }

    .form-control,
    .form-select {
        height: 52px;
        font-size: 18px;
    }

    .btn-hitung {
        height: 55px;
        font-size: 20px;
    }

    #hasil {
        font-size: 55px;
    }
}
</style>
</head>

<body>

<div class="calculator-card">

    <!-- HEADER -->
    <div class="header">

        <!-- FOTO PROFIL -->
        <img
            src="foto.jpg"
            alt="Foto Adly Zaidan"
            class="profile-photo"
            onerror="this.style.display='none'"
        >

        <h1>Kalkulator Aritmatika</h1>

        <div class="identity">
            Adly Zaidan Zidna Fann - NIM. 262302009
        </div>

    </div>

    <!-- BODY KALKULATOR -->
    <div class="calculator-body">

        <!-- ANGKA PERTAMA -->
        <div>
            <label class="form-label">Angka Pertama</label>

            <input
                type="number"
                id="angka1"
                class="form-control"
                placeholder="Masukkan angka pertama"
                step="any"
            >
        </div>

        <!-- ANGKA KEDUA -->
        <div>
            <label class="form-label">Angka Kedua</label>

            <input
                type="number"
                id="angka2"
                class="form-control"
                placeholder="Masukkan angka kedua"
                step="any"
            >
        </div>

        <!-- PILIH OPERATOR -->
        <div>
            <label class="form-label">Pilih Operator</label>

            <select id="operator" class="form-select">

                <optgroup label="Operator Aritmatika">

                    <option value="+">
                        Penjumlahan (+)
                    </option>

                    <option value="-">
                        Pengurangan (-)
                    </option>

                    <option value="*">
                        Perkalian (*)
                    </option>

                    <option value="/">
                        Pembagian (/)
                    </option>

                    <option value="**">
                        Pangkat (**)
                    </option>

                    <option value="%">
                        Modulus (%)
                    </option>

                </optgroup>

                <optgroup label="Operator Perbandingan">

                    <option value="==">
                        Sama dengan (==)
                    </option>

                    <option value="===">
                        Sama persis (===)
                    </option>

                    <option value="!=">
                        Tidak sama dengan (!=)
                    </option>

                    <option value="!==">
                        Tidak sama persis (!==)
                    </option>

                    <option value=">">
                        Lebih besar (>)
                    </option>

                    <option value="<">
                        Lebih kecil (<)
                    </option>

                    <option value=">=">
                        Lebih besar atau sama (>=)
                    </option>

                    <option value="<=">
                        Lebih kecil atau sama (<=)
                    </option>

                </optgroup>

            </select>
        </div>

        <!-- TOMBOL HITUNG -->
        <button
            type="button"
            class="btn-hitung"
            onclick="hitung()"
        >
            Hitung
        </button>

        <!-- HASIL PERHITUNGAN -->
        <div class="result-box">

            <h4>HASIL PERHITUNGAN</h4>

            <div id="hasil">0</div>

            <div id="pesan"></div>

        </div>

    </div>

</div>

<script>

function hitung() {

    const input1 = document.getElementById("angka1").value;
    const input2 = document.getElementById("angka2").value;

    const operator = document.getElementById("operator").value;

    const hasilElement = document.getElementById("hasil");
    const pesanElement = document.getElementById("pesan");

    // Validasi input
    if (input1.trim() === "" || input2.trim() === "") {

        hasilElement.textContent = "0";
        pesanElement.textContent = "Silakan masukkan kedua angka!";

        return;
    }

    const a = Number(input1);
    const b = Number(input2);

    let hasil;

    // PROSES OPERATOR
    switch (operator) {

        // OPERATOR ARITMATIKA

        case "+":
            hasil = a + b;
            break;

        case "-":
            hasil = a - b;
            break;

        case "*":
            hasil = a * b;
            break;

        case "/":

            if (b === 0) {
                hasilElement.textContent = "Error";
                pesanElement.textContent =
                    "Tidak dapat membagi dengan nol!";
                return;
            }

            hasil = a / b;
            break;

        case "**":
            hasil = a ** b;
            break;

        case "%":

            if (b === 0) {
                hasilElement.textContent = "Error";
                pesanElement.textContent =
                    "Modulus dengan nol tidak diperbolehkan!";
                return;
            }

            hasil = a % b;
            break;


        // OPERATOR PERBANDINGAN

        case "==":
            hasil = a == b;
            break;

        case "===":
            hasil = a === b;
            break;

        case "!=":
            hasil = a != b;
            break;

        case "!==":
            hasil = a !== b;
            break;

        case ">":
            hasil = a > b;
            break;

        case "<":
            hasil = a < b;
            break;

        case ">=":
            hasil = a >= b;
            break;

        case "<=":
            hasil = a <= b;
            break;

        default:
            hasil = 0;

    }

    // VALIDASI HASIL
    if (typeof hasil === "number" && !Number.isFinite(hasil)) {

        hasilElement.textContent = "Error";
        pesanElement.textContent =
            "Hasil perhitungan tidak valid!";

        return;
    }

    // MENAMPILKAN HASIL
    if (typeof hasil === "boolean") {

        hasilElement.textContent = hasil ? "TRUE" : "FALSE";

    } else {

        hasilElement.textContent = Number.isInteger(hasil)
            ? hasil
            : Number(hasil.toPrecision(12));

    }

    pesanElement.textContent = "Perhitungan berhasil!";

}

</script>

</body>
</html>
